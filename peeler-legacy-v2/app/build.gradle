plugins {
    id 'com.android.application'
}

android {
    namespace 'io.ads.peelerlegacy'
    compileSdk 34

    defaultConfig {
        applicationId "io.ads.peelerlegacy"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 传统 Xposed API，compileOnly（框架运行时提供）
    compileOnly 'de.robv.android.xposed:api:82'
    compileOnly 'de.robv.android.xposed:api:82:sources'
}
